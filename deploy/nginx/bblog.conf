# 博客站点的 nginx 片段，由 deploy/server_setup.sh 安装到
# /etc/nginx/snippets/bblog.conf，并在 /etc/nginx/sites-available/iteach.conf
# 的 server 块内通过 include 引用。
#
# 现有站点是 server_name _ 的 catch-all，再建一个 catch-all server 块会冲突，
# 因此这里只用 location 分流：/blog/ 走容器，其余仍归 iteach。

location = /blog {
    return 301 /blog/;
}

location /blog/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 8m;
}
